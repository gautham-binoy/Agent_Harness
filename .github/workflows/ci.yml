name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest httpx

      - name: Run test suite
        run: |
          pytest -v

      - name: Verify CLI functionality
        run: |
          harness --version
          harness --help

      - name: Run benchmark dry-run verification
        run: |
          harness benchmark --config baseline --dry-run --category bug_fix --difficulty easy
          harness benchmark --config full-harness --dry-run --category bug_fix --difficulty easy
          harness compare --baseline baseline --candidate full-harness
