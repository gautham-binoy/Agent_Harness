name: ablation-d-linter

agent:
  mode: developer
  temperature: 0.2

context:
  repository_summary: false
  git_status: false
  directory_tree: false

tools:
  filesystem:
    read: true
    write: true
  terminal:
    enabled: true
  git:
    read: true
    write: false
  tests:
    enabled: false
  linter:
    enabled: true

feedback:
  tests: false
  linter: true

max_iterations: 3
