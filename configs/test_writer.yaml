name: test-writer-harness

agent:
  mode: test_writer
  temperature: 0.2

context:
  repository_summary: true
  git_status: true
  directory_tree: true

tools:
  filesystem:
    read: true
    write: true
  terminal:
    enabled: true
  git:
    read: true
    write: false
  tests:
    enabled: true
  linter:
    enabled: false

feedback:
  tests: true
  linter: false

max_iterations: 5
